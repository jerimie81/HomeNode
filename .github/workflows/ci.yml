name: HomeNode CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # VERIFY: pin to full commit SHA in production CI

      - name: Set up JDK 17
        uses: actions/setup-java@v4 # VERIFY: pin to full commit SHA and match Android Studio JBR/JDK version
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4 # VERIFY: pin to full commit SHA

      - name: Verify no hardcoded secrets or private keys in source
        run: |
          ! grep -rnE "BEGIN (RSA |EC |OPENSSH |PRIVATE )?KEY|client_secret" \
            app/ service-node/ service-files/ core-transport/ core-identity/ core-storage/ storage-local/ storage-network/ storage-cloud/

      - name: Run unit tests (including ArchitectureDependencyTest)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace
